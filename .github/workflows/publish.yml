# Publishes CycleGuide's prompt pack (:prompts, cycleguidePromptsVersion) to GitHub Packages when
# the tag prompts-v<version> is pushed. The tag must match the version in
# gradle.properties, and the yorisoi version it uses must be published first.
name: Publish

on:
  push:
    tags:
      - 'prompts-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag
        run: |
          version=$(grep '^cycleguidePromptsVersion=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME#prompts-v}" != "${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match cycleguidePromptsVersion=${version}" >&2
            exit 1
          fi

      - name: Test and publish
        run: ./gradlew :prompts:test :prompts:publish --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
